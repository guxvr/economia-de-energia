name: Publicar apresentação
on:
  push:
    branches: [main]
    paths: ['slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: slides
      - name: Publicar
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Aguardar disponibilização do artefato
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Publicar novamente
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
